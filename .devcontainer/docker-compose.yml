name: ${project_name}
services:
    workspace:
        container_name: ${project_name}-workspace
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - ..:/workspace
            - ~/.ssh:/root/.ssh
            - ./nginx:/etc/nginx
        env_file:
            - path: ./.env
              required: true
            - path: ./override.env
              required: false
        networks:
            - dev-net

    postgres:
        container_name: ${project_name}-postgres
        image: postgres:17.0-bullseye
        hostname: ${project_name}-postgres-host
        restart: always
        ports:
            - 5432:5432
        volumes:
            - ./postgres/data:/var/lib/postgresql/data
            - ./postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
        env_file:
            - path: "./postgres/.default_db_config.env"
              required: true
            - path: "./postgres/.override_db_config.env"
              required: false
            - path: ./.env
              required: true
            - path: ./override.env
              required: false
        networks:
            - dev-net

    pgadmin:
        container_name: ${project_name}-pgadmin
        image: dpage/pgadmin4:latest
        hostname: ${project_name}-pgadmin-host
        ports:
          - "8080:80"
        depends_on:
          - postgres
        volumes:
          - ./postgres/servers.json:/pgadmin4/servers.json
        env_file:
            - path: "./postgres/.default_db_config.env"
              required: true
            - path: "./postgres/.override_db_config.env"
              required: false
            - path: ./.env
              required: true
            - path: ./override.env
              required: false
        networks:
            - dev-net

    rabbitmq:
        container_name: ${project_name}-rabbitmq
        image: rabbitmq:3.13-management
        hostname: ${project_name}-rabbitmq
        ports:
          - "5672:5672" #for rabbitmq server
          - "15672:15672" #for rabbitmq management UI
        volumes:
          - rabbitmq-data:/var/lib/rabbitmq
        env_file:
          - path: ./.env
            required: true
          - path: ./override.env
            required: false
        networks:
          - dev-net

networks:
    dev-net:
        external: true

volumes:
    postgres:
    rabbitmq-data:
