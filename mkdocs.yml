      - Auth service: backend/auth.md
      - Booking service: backend/booking.md
      - Dashboard service: backend/dashboard.md
      - Payment service: backend/payment.md
      - Notification service: backend/notification.md
  - Frontend:
      - frontend/index.md
      - Styling and theming: frontend/styling-and-theming.md
      - Typography: frontend/typography.md
      - Accessibility: frontend/accessibility.md
      - Adding a client app: frontend/adding-a-client-app.md
  - Guides:
      - guides/index.md
      - Database migrations: guides/database-migrations.md
      - Exceptions and error codes: guides/exceptions-and-error-codes.md
      - Publishing and consuming messages: guides/messaging.md
      - Email templates: guides/email-templates.md
      - Routes and guards: guides/routes-and-guards.md
      - Testing and linting: guides/testing-and-linting.md
      - Debugging: guides/debugging.md
      - PgAdmin, Mailpit and RabbitMQ: guides/dev-tools.md
  - Reference:
      - reference/index.md
      - Configuration: reference/configuration.md
      - Ports and hostnames: reference/ports-and-hostnames.md
      - Error codes: reference/error-codes.md
      - Roles and permissions: reference/roles-and-permissions.md
      - Scripts: reference/scripts.md
      - API reference:
          - reference/api/index.md
          - Auth API: reference/api/auth.md
          - Booking API: reference/api/booking.md
          - Dashboard API: reference/api/dashboard.md
          - Payment API: reference/api/payment.md
  - Standards:
