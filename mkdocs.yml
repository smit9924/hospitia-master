# Hospitia documentation site.
#
# Preview:  uv run --no-project --with-requirements docs/requirements.txt mkdocs serve
# Check:    bash ./scripts/check_docs.sh   (strict build: broken links and pages missing from nav fail)
#
# Every page under docs/ must be listed in `nav` below.
# See docs/standards/documentation.md for how to add a page.

site_name: Hospitia
site_description: Guest house management for NGOs — project documentation
repo_name: smit9924/hospitia-master
repo_url: https://github.com/smit9924/hospitia-master
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

exclude_docs: |
  .sync-state.json
  requirements.txt

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - content.action.edit
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search
  - neoteroi.mkdocsoad:
      use_pymdownx: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: info
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

nav:
  - Home: index.md
  - About:
      - about/index.md
      - Vision and mission: about/vision.md
      - Features: about/features.md
      - Roadmap: about/roadmap.md
      - Glossary: about/glossary.md
  - Getting started:
      - getting-started/index.md
      - Prerequisites: getting-started/prerequisites.md
      - Local setup (dev container): getting-started/local-setup.md
      - Claude Code cloud sessions: getting-started/cloud-sessions.md
      - Running the app: getting-started/running-the-app.md
      - Local services and credentials: getting-started/local-services.md
      - Troubleshooting: getting-started/troubleshooting.md
  - Tutorials:
      - tutorials/index.md
      - Product tour: tutorials/product-tour.md
      - Your first backend endpoint: tutorials/first-backend-endpoint.md
      - Your first frontend page: tutorials/first-frontend-page.md
      - Your first message flow: tutorials/first-message-flow.md
  - Architecture:
      - architecture/index.md
      - Workspace and repositories: architecture/workspace.md
      - Services: architecture/services.md
      - Authentication and roles: architecture/auth-and-roles.md
      - Messaging and events: architecture/messaging.md
      - Data and databases: architecture/data.md
      - Active organization: architecture/active-organization.md
      - Frontend architecture: architecture/frontend.md
  - Backend:
