      - General: standards/general.md
      - Architecture: standards/architecture.md
      - Backend (Python/FastAPI): standards/backend.md
      - Frontend (Angular/TypeScript): standards/frontend-angular.md
      - HTML and SCSS: standards/html-and-scss.md
