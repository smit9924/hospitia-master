jenkins:
  clouds:
    - docker:
        name: docker

        containerCap: 4

        dockerApi:
          dockerHost:
            uri: "unix:///var/run/docker.sock"

        templates:
          - name: node
            labelString: docker-agent-node
            mode: EXCLUSIVE
            remoteFs: /home/jenkins/agent

            dockerTemplateBase:
              image: smit9924/hospitia-jenkins-agent:node-latest
              mounts:
                - "type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock"

            connector:
              attach:
                user: "root"

          - name: python
            labelString: docker-agent-python
            mode: EXCLUSIVE
            remoteFs: /home/jenkins/agent

            dockerTemplateBase:
              image: smit9924/hospitia-jenkins-agent:python-latest
              mounts:
                - "type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock"

            connector:
              attach:
                user: "root"
