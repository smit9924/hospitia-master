credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              id: dockerhub
              username: ${DOCKERHUB_USERNAME}
              password: ${DOCKERHUB_TOKEN}
              description: Docker Hub Credentials

          - basicSSHUserPrivateKey:
              id: github-ssh
              username: ${GITHUB_USERNAME}
              privateKeySource:
                directEntry:
                  privateKey: ${GITHUB_SSH_PRIVATE_KEY}
              description: GitHub SSH Key