credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              id: dockerhub
              username: ${DOCKERHUB_USERNAME}
              password: ${DOCKERHUB_TOKEN}
              description: Docker Hub Credentials

          - usernamePassword:
              id: github-token
              username: ${GITHUB_USERNAME}
              password: ${GITHUB_ACCESS_TOKEN}
              description: GitHub Personal Access Token

          - basicSSHUserPrivateKey:
              id: deploy-ssh
              username: ${DEPLOYMENT_SERVER_USERNAME}
              description: SSH Key for Deployment server
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:${DEPLOYMENT_SERVER_SSH_KEY_FILE_PATH}}"

          - string:
              id: deployment-server-ip
              description: Deployment Server Public IP
              secret: ${DEPLOYMENT_SERVER_PUBLIC_IP}