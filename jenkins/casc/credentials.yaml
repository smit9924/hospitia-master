credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              id: dockerhub
              username: ${DOCKERHUB_USERNAME}
              password: ${DOCKERHUB_TOKEN}
              description: Docker Hub Credentials

          - usernamePassword:
              id: github-token
              username: ${GITHUB_USERNAME}
              password: ${GITHUB_ACCESS_TOKEN}
              description: GitHub Personal Access Token