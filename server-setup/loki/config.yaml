# Enable authentication if multiple tenants are pushing logs to loki
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

  # Set log level for loki server
  # log_level: info, debug, warn, error

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

limits_config:
  retention_period: ${LOKI_RETENTION_DAYS}d
  allow_structured_metadata: true
  volume_enabled: true
  # Reject logs older than 1 week
  reject_old_samples: true
  reject_old_samples_max_age: 168h

  # Use below config when there is different retention period for different services required
  # retention_stream:
  #   - selector: '{service="auth"}'
  #     priority: 1
  #     period: 14d

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

ingester:
  wal:
    enabled: true
    dir: /loki/wal

analytics:
  reporting_enabled: false
