# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name auth.yatribhavan.umiyadhams.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name auth.yatribhavan.umiyadhams.com;

    ssl_certificate     /etc/nginx/ssl/certificate.crt;
    ssl_certificate_key /etc/nginx/ssl/private.key;

    # This block is added to redirect for the server validation for SSL certificate issuance.
    # Authentication file (as of now provied by zero ssl) should be placed at
    # "/var/www/cert-validation/.well-known/pki-validation/" inside nginx container..
    location ^~ /.well-known/pki-validation/ {
        alias /var/www/cert-validation/.well-known/pki-validation/;
    }

    location / {
        proxy_pass http://auth-service:9001;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }
}