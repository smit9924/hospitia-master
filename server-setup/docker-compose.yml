services:
  postgres:
    image: postgres:17
    container_name: hospitia-postgres
    restart: on-failure

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres

    ports:
      - "5432:5432"

    volumes:
      # Database data
      - ./postgres/data:/var/lib/postgresql/data

      # Initialization scripts
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    networks:
      - hospitia-network

    env_file:
      - path: ./.env
        required: true

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.29-alpine
    container_name: hospitia-nginx
    restart: on-failure

    depends_on:
      - postgres

    ports:
      - "80:80"
      - "443:443"

    networks:
      - hospitia-network

    env_file:
      - path: ./.env
        required: true

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

  rabbitmq:
    image: rabbitmq:4-management
    container_name: hospitia-rabbitmq
    restart: on-failure

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq

    networks:
      - hospitia-network

    env_file:
      - path: ./.env
        required: true

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  hospitia-network:
    external: true